trigger:
  branches:
    include:
      - main
      - master

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: mottuspot-variables
  - name: TAG
    value: "$(Build.BuildId)"

stages:
  # =============================================
  # STAGE 1: CI - Build e Testes
  # =============================================
  - stage: CI
    displayName: "Continuous Integration"
    jobs:
      - job: Build
        displayName: "Build and Test"
        steps:
          # Checkout do código
          - checkout: self
            displayName: "Checkout Repository"

          # Setup Java 17
          - task: JavaToolInstaller@0
            displayName: "Setup Java 17"
            inputs:
              versionSpec: "17"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          # Executar testes
          - task: Gradle@3
            displayName: "Run Tests"
            inputs:
              gradleWrapperFile: "gradlew"
              tasks: "test"
              publishJUnitResults: true
              testResultsFiles: "**/TEST-*.xml"
              javaHomeOption: "JDKVersion"
              jdkVersionOption: "1.17"

          # Publicar resultados dos testes
          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/TEST-*.xml"
              failTaskOnFailedTests: true

          # Build com Gradle
          - task: Gradle@3
            displayName: "Gradle Build"
            inputs:
              gradleWrapperFile: "gradlew"
              tasks: "clean build"
              options: "-x test"
              publishJUnitResults: false
              javaHomeOption: "JDKVersion"
              jdkVersionOption: "1.17"
              gradleOptions: "-Xmx3072m"

          # Usa o script build.sh já presente no repositório
          - task: AzureCLI@2
            displayName: "Build and Push to ACR (script)"
            inputs:
              azureSubscription: "AzureServiceConnection"
              scriptType: "bash"
              scriptLocation: "scriptPath"
              scriptPath: "scripts/build.sh"

          # Publicar artefato dos scripts
          - task: PublishBuildArtifacts@1
            displayName: "Publish Build Artifacts"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "drop"
              publishLocation: "Container"

  # =============================================
  # STAGE 2: CD - Deploy
  # =============================================
  - stage: CD
    displayName: "Continuous Deployment"
    dependsOn: CI
    condition: succeeded()
    jobs:
      - deployment: DeployToAzure
        displayName: "Deploy to Azure Container Instance"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                # Usa o script deploy.sh já presente no repositório
                - task: AzureCLI@2
                  displayName: "Deploy Application (script)"
                  inputs:
                    azureSubscription: "AzureServiceConnection"
                    scriptType: "bash"
                    scriptLocation: "scriptPath"
                    scriptPath: "scripts/deploy.sh"
