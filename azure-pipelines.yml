trigger:
  branches:
    include:
      - main

pool:
  vmImage: "ubuntu-latest"

variables:
  - group: mottuspot-variables
  - name: TAG
    value: "$(Build.BuildId)"
  - name: AZURE_SERVICE_CONNECTION
    value: "MottuSpotAzureConnection" # set the exact name of your service connection in pipeline variables or Variable Group

stages:
  # =============================================
  # STAGE 1: CI - Build e Testes
  # =============================================
  - stage: CI
    displayName: "Continuous Integration"
    jobs:
      - job: Build
        displayName: "Build and Test"
        steps:
          # Checkout do código
          - checkout: self
            displayName: "Checkout Repository"

          # Setup Java 17
          - task: JavaToolInstaller@0
            displayName: "Setup Java 17"
            inputs:
              versionSpec: "17"
              jdkArchitectureOption: "x64"
              jdkSourceOption: "PreInstalled"

          # Executar testes
          - task: Gradle@3
            displayName: "Run Tests"
            inputs:
              gradleWrapperFile: "gradlew"
              tasks: "test"
              publishJUnitResults: true
              testResultsFiles: "**/TEST-*.xml"
              javaHomeOption: "JDKVersion"
              jdkVersionOption: "1.17"

          # Publicar resultados dos testes
          - task: PublishTestResults@2
            displayName: "Publish Test Results"
            condition: succeededOrFailed()
            inputs:
              testResultsFormat: "JUnit"
              testResultsFiles: "**/TEST-*.xml"
              failTaskOnFailedTests: true

          # Build com Gradle
          - task: Gradle@3
            displayName: "Gradle Build"
            inputs:
              gradleWrapperFile: "gradlew"
              tasks: "clean build"
              options: "-x test"
              publishJUnitResults: false
              javaHomeOption: "JDKVersion"
              jdkVersionOption: "1.17"
              gradleOptions: "-Xmx3072m"

          # Pre-check: certificar que a service connection foi configurada (CI)
          - script: |
              if [ -z "$AZURE_SERVICE_CONNECTION" ]; then
                echo "##vso[task.logissue type=error]AZURE_SERVICE_CONNECTION is not set. Set the pipeline variable to the name of a Service Connection (Project settings → Service connections)."
                echo "See: https://aka.ms/yamlauthz"
                exit 1
              fi
            displayName: "Check Azure Service Connection (CI)"
          - task: AzureCLI@2
            displayName: "Build and Push to ACR (script)"
            inputs:
              azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
              scriptType: "bash"
              scriptLocation: "scriptPath"
              scriptPath: "scripts/build.sh"

          # Publicar artefato dos scripts
          - task: PublishBuildArtifacts@1
            displayName: "Publish Build Artifacts"
            inputs:
              PathtoPublish: "$(Build.ArtifactStagingDirectory)"
              ArtifactName: "drop"
              publishLocation: "Container"

  # =============================================
  # STAGE 2: CD - Deploy
  # =============================================
  - stage: CD
    displayName: "Continuous Deployment"
    dependsOn: CI
    condition: succeeded()
    jobs:
      - deployment: DeployToAzure
        displayName: "Deploy to Azure Container Instance"
        environment: "production"
        strategy:
          runOnce:
            deploy:
              steps:
                # Pre-check: certificar que a service connection foi configurada (CD)
                - script: |
                    if [ -z "$AZURE_SERVICE_CONNECTION" ]; then
                      echo "##vso[task.logissue type=error]AZURE_SERVICE_CONNECTION is not set. Set the pipeline variable to the name of a Service Connection (Project settings → Service connections)."
                      echo "See: https://aka.ms/yamlauthz"
                      exit 1
                    fi
                  displayName: "Check Azure Service Connection (CD)"
                - task: AzureCLI@2
                  displayName: "Deploy Application (script)"
                  inputs:
                    azureSubscription: "$(AZURE_SERVICE_CONNECTION)"
                    scriptType: "bash"
                    scriptLocation: "scriptPath"
                    scriptPath: "scripts/deploy.sh"
